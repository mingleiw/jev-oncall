name: Feature request
description: Suggest an integration, a policy option, or something else.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/mingleiw/jev-oncall/issues?q=is%3Aopen+label%3Aroadmap) first. If your idea is there, a comment on that issue helps more than a new one.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on call, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. If it touches paging, say how it stays safe when Jev is wrong or unavailable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
