global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [rules.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Prometheus scrapes itself only so rules.yml can tell how long it has been up.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
