route:
  receiver: jev-oncall
  group_by: [service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: jev-oncall
    webhook_configs:
      - url: http://jev-oncall:8090/ingest/alertmanager
        send_resolved: true
        http_config:
          authorization:
            credentials: demo-secret   # must match JEV_WEBHOOK_SECRET
